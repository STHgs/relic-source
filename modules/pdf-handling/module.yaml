# modules/pdf-handling/module.yaml — PDF 处理流程
id: pdf-handling
permissions: []
workflows:
  - id: pdf-read
    intent: Read PDFs in paged chunks to avoid context overflow
    applies_when: reading large PDFs
    priority: normal
    steps:
      - "Use look_at for summary first, decide if detailed reading is needed"
      - "Use read tool for detail, large files use offset/limit pagination"
      - "Use multimodal-looker for tables and diagrams, not plain text"
      - "Use specialized parsing libraries for structured data extraction, not manual line-by-line reading"

  - id: pdf-write
    intent: PDF generation steps
    applies_when: generating PDF output
    priority: normal
    steps:
      - "Prefer Typst for PDF generation: native math formula rendering ($...$ syntax), native CJK support, native PDF bookmarks (outline + heading numbering), single static binary no LaTeX environment needed"
      - "Check Typst availability: run `which typst` or `typst --version`. If not found, auto-install: detect platform arch with `uname -m` (x86_64→x86_64-unknown-linux-musl, aarch64→aarch64-unknown-linux-musl), download from https://github.com/typst/typst/releases/latest matching asset (tar.xz), extract typst binary to ~/.local/bin/, verify with `typst --version`. This is a low-risk operation (single static binary, no sudo, user-local path)"
      - "If Typst still unavailable after install attempt and no formulas needed: reportlab (Python) or pdfkit (Node) as fallback. For CJK in reportlab: register CID font STSong-Light (TTC PS outline fonts incompatible). For math formulas in reportlab: use matplotlib mathtext to render LaTeX to PNG then embed as Image (workaround, not native)"
      - "Set CJK font in Typst: #set text(font: (\"Noto Sans CJK SC\", \"New Computer Modern\"), size: 11pt). System CJK fonts available: check with fc-list :lang=zh"
      - "Typst math syntax: inline $x^2$, display $$ frac(a,b) $$, use cal(L) for script L, delta(t), omega, integral_0^infinity, dif f — NOT LaTeX \\cal, \\delta etc. See https://typst.app/docs/reference/math/"
      - "Typst PDF bookmarks: use #set heading(numbering: \"1.1\") for auto-numbered sections, #outline(title: \"目录\", indent: 1.5em) for TOC page. PDF readers will show bookmark sidebar automatically"
      - "Compile: typst compile input.typ output.pdf (single pass, no multi-pass like LaTeX)"
      - "Verify PDF: render pages to PNG with pymupdf (fitz), check rendering with look_at"
      - "Artifacts go in the workspace root /mnt/e/AIworkspace/ by default; project artifacts in output/vN/"
risk_levels:
  low: []
  medium: []
  high: []
